[project]
name = "open-policing-database"
version = "0.1.0"
description = "Build a DuckDB database from the Stanford Open Policing Project standardized stop data"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.0", "requests", "huggingface_hub", "pyyaml", "datapond-build"]

[tool.uv.sources]
datapond-build = { git = "https://github.com/datapond-db/datapond-build", tag = "v0.1.4" }
